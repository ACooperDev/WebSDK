        const ROOT = 'cam0/hmi';
        const CELLS = 'A0:Z100';

        let camera = null;

        //Camera methods    
        async function connect() {
            const ip = document.getElementById('ip').value.trim();
            const USER = document.getElementById('username').value;
            const PASS = document.getElementById('password').value;
            const inputURL = document.getElementById('inputURL').value.trim();

            if (!ip) {
                console.log('Please enter an IP address.');
                alert('Please enter an IP address.');
                return;
            }

            document.getElementById('webhmi').src = 'http://' + ip + '/' + inputURL;

            if (camera) {
                try {
                    await camera.Disconnect();
                } catch (_) {
                    // Ignore disconnect errors when reopening
                }
            }

            camera = new CognexCamera(ip, 80, USER, PASS);
            camera.cells = CELLS;

            //Event subscriptions
            camera.StateChanged.push(async (state) => {
                //console.log('[EVENT] Camera State Changed:', state);
            });

            camera.ResultsChanged.push(async (results) => {
                //console.log('[EVENT] Results Changed:', results);
            });

            camera.LiveModeChanged.push(async (isLive) => {
                //console.log('[EVENT] Live Mode Changed:', isLive);
            });

            camera.JobInfoChanged.push(async (jobName) => {
                //console.log('[EVENT] Job Changed:', jobName);
            });

            camera.EditorAttachedChanged.push(async () => {
                //console.log('[EVENT] Editor Attached');
            });

            camera.JobValidationDone.push(async () => {
                //console.log('[EVENT] Job Validation Done');
            });

            try {
                document.getElementById('status').textContent = 'Status: Connecting...';
                await camera.Connect();
                document.getElementById('status').textContent = 'Status: Connected and Logged In';
                document.getElementById('triggerBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = false;
                console.log('Connection established.');
            } catch (e) {
                console.error('Connection Failed:', e);
                document.getElementById('status').textContent = `Status: Error - ${e.message}`;
            }
        }

        async function disconnect() {
            if (!camera) return;
            try {
                await camera.Disconnect();
                document.getElementById('status').textContent = 'Status: Disconnected';
                document.getElementById('triggerBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = true;
                console.log('Disconnected.');
            } catch (e) {
                console.error('Disconnect failed:', e);
            }
        }

        async function triggerManual() {
            if (!camera) return;
            try {
                await camera.ManualAcquire();                
                console.log('Manual trigger sent successfully.');
                
            } catch (e) {
                console.error('Failed to trigger:', e);
            }
        }
